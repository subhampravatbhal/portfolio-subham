name: Deploy Static Website to Azure

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Get the code from GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Deploy static files to Azure Static Web Apps
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_GLACIER_0D0A59510 }}
          action: upload
          app_location: "/"
          api_location: ""
          output_location: ""
          skip_app_build: true
